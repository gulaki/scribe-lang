[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-lang"
version = "0.1.0"
description = "Scribe language compiler implemented with Python and Lark"
requires-python = ">=3.10"
dependencies = ["lark>=1.1,<2"]

[project.scripts]
scribe = "scribe_lang.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scribe_lang*"]

[tool.setuptools.package-data]
scribe_lang = ["grammar/*.lark"]
